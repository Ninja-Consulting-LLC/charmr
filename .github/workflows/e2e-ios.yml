# Lightweight smoke: verifies toolchain on a macOS runner. Full `npm run test:e2e` needs Metro,
# a booted Simulator, installed app, and a reachable API — run locally or extend this job with
# caching for Pods/build artifacts and secrets for `CHARMR_*` / Firebase as needed.
name: iOS E2E (Maestro smoke)

on:
  workflow_dispatch:

jobs:
  maestro-macos-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash

      - name: Maestro version
        run: '$HOME/.maestro/bin/maestro --version'

      - name: Xcode version
        run: xcodebuild -version

      - name: Count numbered Maestro flows
        run: |
          set -euo pipefail
          shopt -s nullglob
          flows=(.maestro/[0-9][0-9]_*.yaml)
          echo "Numbered flows: ${#flows[@]}"
          printf '%s\n' "${flows[@]}"

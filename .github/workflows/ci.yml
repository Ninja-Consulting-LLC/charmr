name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
        continue-on-error: true
      - run: npm run build -w @charmr/shared

  backend:
    runs-on: ubuntu-latest
    needs: shared
    env:
      DATABASE_TYPE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @charmr/shared
      - run: npm test -w charmr-backend
      - run: npm run build -w charmr-backend

  mobile:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @charmr/shared
      - run: npm run lint
      - run: npm test

  # Bash syntax for Maestro / E2E runners (no Simulator; catches broken scripts early).
  e2e-scripts:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - name: Validate E2E shell scripts
        run: |
          set -euo pipefail
          for f in \
            scripts/run-maestro-e2e.sh \
            scripts/run-maestro-one.sh \
            scripts/run-maestro-stub-llm.sh \
            scripts/verify-e2e-support-api.sh \
            scripts/verify-e2e-stub-llm-api.sh \
            scripts/start-backend-e2e-stub.sh
          do
            echo "bash -n $f"
            bash -n "$f"
          done

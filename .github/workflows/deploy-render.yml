# Deploy backend to Render (monorepo root — GitHub only runs workflows under /.github)
name: Deploy backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-render.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-render.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_TYPE: sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (repo)
        run: npm run lint

      - name: Build shared package
        run: npm run build -w @charmr/shared

      - name: Test backend
        run: npm test -w charmr-backend

      - name: Build backend
        run: npm run build -w charmr-backend

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: render/deploy@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

# A6: After onboarding, relaunch app without clearing storage → still on Home.
appId: com.ninjadating.charmr
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Get Started'
    timeout: 25000
- tapOn: 'Get Started'
- extendedWaitUntil:
    visible: 'Enable Dating Keyboard'
    timeout: 12000
- tapOn:
    id: 'skip-button'
- extendedWaitUntil:
    visible: 'Try Our Dating Coach'
    timeout: 35000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Try Our Dating Coach'
    timeout: 25000
